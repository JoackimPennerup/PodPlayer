; Offline scaffold. Requires an existing LOCAL Espressif32 platform supporting
; Arduino core 3.x. No registry packages or guessed core/library API combinations.
; Set PODPLAYER_ESP32_PLATFORM_DIR and PODPLAYER_LIBRARIES_DIR before using pio.
[platformio]
default_envs = waveshare_s3_v2

[env]
platform = file://${sysenv.PODPLAYER_ESP32_PLATFORM_DIR}
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -DBOARD_HAS_PSRAM
lib_extra_dirs = ${sysenv.PODPLAYER_LIBRARIES_DIR}
monitor_speed = 115200

[env:waveshare_s3_v2]
build_flags = ${env.build_flags} -DPODPLAYER_TOUCH_VERSION=2

[env:waveshare_s3_v1]
build_flags = ${env.build_flags} -DPODPLAYER_TOUCH_VERSION=1
